<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#243744">
<link rel="icon" type="image/svg+xml" href="./assets/football-ai-circuit.svg">
<title>PronoFoot AI — Football Prediction Lab</title>
<style>
:root{color-scheme:light;--ink:#0a1b46;--muted:#4f6d99;--green:#08b968;--green2:#00a85c;--line:#e5edf7;--bg:#f3f8fc;--panel:#ffffffd9;--pale:#f5f8fc;--shadow:0 3px 12px rgba(17,43,72,.035)}
*{box-sizing:border-box}html{min-width:320px;background:var(--bg);scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.4;background:linear-gradient(180deg,#f5f9fd 0,#eef5fa 100%);min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer}a{color:inherit}
.topbar{height:86px;padding:0 20px;display:flex;align-items:center;gap:25px;color:#f9fbff;background:linear-gradient(110deg,#1c2c38 0%,#293b48 57%,#1b303e 100%);box-shadow:0 2px 8px #172e3b18}
.brand{display:flex;align-items:center;gap:12px;min-width:290px;text-decoration:none;color:#fff}
.brand-logo{width:56px;height:56px;flex:0 0 56px}.brand-wordmark{min-width:0}
.brand-name{font-size:34px;line-height:1;font-weight:800;letter-spacing:-1.3px;white-space:nowrap}
.brand-name em{font-style:normal;color:#05c77b}.brand-sub{font-size:13px;letter-spacing:1.35px;line-height:1.8;white-space:nowrap}
.nav{display:flex;align-items:center;gap:4px;flex:1;min-width:0;height:100%}
.nav a{height:49px;padding:0 13px;display:flex;align-items:center;justify-content:center;gap:9px;border-radius:10px;text-decoration:none;color:#f1f5f9;white-space:nowrap;font-size:15px;position:relative}
.nav .nav-icon{display:block;width:19px;height:19px;min-width:19px;max-width:19px;min-height:19px;max-height:19px;flex:0 0 19px;object-fit:contain;opacity:1;}
.nav a.active .nav-icon{opacity:1;}
.nav a.active{background:#ffffff0d;color:#91edc1}.nav a.active:after{content:"";height:4px;position:absolute;bottom:0;left:14px;right:14px;background:#08c977;border-radius:5px}
.nav a:hover{background:#ffffff0c}
.api-status{border:1px solid #087f55;border-radius:28px;padding:11px 17px;white-space:nowrap;background:#006a4626;color:#c7f7dd;font-size:14px;display:flex;align-items:center;gap:9px}
.api-status strong{color:#14df80;font-weight:650}.dot{width:12px;height:12px;border-radius:50%;background:#08d46b;display:inline-block;box-shadow:0 0 12px #08d46b55}
main{max-width:1900px;margin:0 auto;padding:15px 18px 24px}
.workspace{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:12px;align-items:stretch;min-height:calc(100vh - 166px)}
.panel{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-height:520px}
.left-panel{padding:11px 13px 12px}.right-panel{padding:14px 12px 12px}
.footer{max-width:1900px;margin:0 auto;padding:0 18px 18px;font-size:11px;color:#647b9c;text-align:center}
@media(max-width:1550px){.topbar{gap:15px;padding:0 16px}.brand{min-width:255px}.brand-name{font-size:29px}.brand-logo{width:48px;height:48px;flex-basis:48px}.nav a{padding:0 8px;font-size:13px}.api-status{font-size:12px;padding:10px 12px}.workspace{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr)}}
@media(max-width:1120px){.topbar{height:auto;min-height:82px;flex-wrap:wrap;padding:12px 16px;gap:10px}.brand{min-width:0;flex:1}.nav{order:3;flex-basis:100%;height:45px;overflow-x:auto}.api-status{margin-left:auto}.workspace{grid-template-columns:1fr;min-height:0}.panel{min-height:360px}}
@media(max-width:650px){main{padding:10px}.topbar{padding:11px 10px}.brand-logo{width:40px;height:40px;flex-basis:40px}.brand-name{font-size:24px}.brand-sub{font-size:9px;letter-spacing:1px}.api-status{font-size:10px;padding:8px 10px;gap:5px}.dot{width:9px;height:9px}.nav a{font-size:12px;padding:0 9px}.panel{min-height:280px}.footer{padding:0 10px 14px}}

/* Responsive layout refinements */
.nav a:focus-visible,.brand:focus-visible{outline:2px solid #ffffff;outline-offset:3px}
@media(max-width:1120px){
 .topbar{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;height:auto;min-height:0;padding:12px 18px;gap:12px 16px}
 .brand{min-width:0;flex:initial}
 .nav{grid-column:1/-1;grid-row:2;order:initial;display:flex;flex-wrap:wrap;justify-content:flex-start;gap:6px;height:auto;min-height:46px;overflow:visible}
 .nav a{flex:0 0 auto;min-height:44px}
 .api-status{grid-column:2;grid-row:1;margin:0;justify-self:end;max-width:100%;font-size:12px;padding:9px 12px}
 .workspace{grid-template-columns:minmax(0,1fr);min-height:0}
 .panel{min-height:320px}
}
@media(max-width:650px){
 .topbar{grid-template-columns:minmax(0,1fr);padding:12px 12px 10px;gap:10px}
 .brand{grid-column:1;grid-row:1;gap:9px}
 .brand-logo{width:42px;height:42px;flex:0 0 42px}
 .brand-name{font-size:25px;letter-spacing:-.8px}
 .brand-sub{font-size:9px;letter-spacing:1px;line-height:1.5}
 .api-status{grid-column:1;grid-row:2;justify-self:start;margin:0;font-size:11px;padding:7px 10px}
 .nav{grid-column:1;grid-row:3;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;width:100%;min-height:0}
 .nav a{height:auto;min-height:58px;padding:7px 3px;display:flex;flex-direction:column;gap:4px;font-size:11px;line-height:1.2;white-space:normal;text-align:center;border-radius:8px}
 .nav .nav-icon{width:19px;height:19px;min-width:19px;max-width:19px;min-height:19px;max-height:19px;flex-basis:19px}
 .nav a.active:after{height:3px;left:10px;right:10px}
 main{padding:10px 10px 18px}
 .workspace{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
 .panel{min-height:260px;border-radius:10px}
 .left-panel,.right-panel{padding:11px 10px}
 .footer{padding:0 10px 14px}
}
@media(max-width:360px){
 .brand-name{font-size:20px}
 .brand-logo{width:32px;height:32px;flex-basis:32px}
 .nav a{font-size:11px}
 .api-status{font-size:9px}
}
@media(max-width:650px){
 .topbar{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;align-items:center;column-gap:8px;row-gap:10px}
 .brand{grid-column:1;grid-row:1;min-width:0;gap:7px}
 .api-status{grid-column:2;grid-row:1;justify-self:end;align-self:center;margin:0;max-width:100%}
 .nav{grid-column:1/-1;grid-row:2;margin-top:14px}

 .brand-logo{width:36px;height:36px;flex:0 0 36px}
 .brand-name{font-size:21px;letter-spacing:-.65px}
 .brand-sub{font-size:8px;letter-spacing:.8px;line-height:1.35}
 .nav a{font-size:14px;min-height:57px;padding:7px 3px;gap:4px}
 .nav .nav-icon{width:18px;height:18px;min-width:18px;max-width:18px;min-height:18px;max-height:18px;flex-basis:18px}
 .api-status{font-size:10px;line-height:1.15;padding:6px 8px;gap:5px;border-radius:18px}
 .api-status .dot{width:7px;height:7px;box-shadow:0 0 7px #08d46b55}
}


/* Live health indicator for the two upstream data collections */
.topbar{position:relative}
.api-status{appearance:none;font-family:inherit;cursor:pointer;gap:8px;padding:7px 12px;border-radius:22px;font-size:13px;line-height:1.2;transition:border-color .15s,background .15s}
.api-status:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.status-symbol{width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 19px;border-radius:50%;font-size:13px;font-weight:900;line-height:1}
.api-status-label{white-space:nowrap;color:#f8fafc;font-weight:650}
.api-status-label strong{font-weight:800}
.api-status.status-ok{border-color:#08b968;background:#063d2b;color:#08e080}
.api-status.status-ok .status-symbol{background:#08c875;color:#062c20}
.api-status.status-ok .api-status-label strong{color:#24e58b}
.api-status.status-warning{border-color:#e5a51a;background:#49340b;color:#ffd15a}
.api-status.status-warning .status-symbol{background:#f0ad24;color:#382500}
.api-status.status-warning .api-status-label strong{color:#ffd34f}
.api-status.status-error{border-color:#ef5350;background:#481c22;color:#ff7774}
.api-status.status-error .status-symbol{background:#ef5350;color:#fff}
.api-status.status-error .api-status-label strong{color:#ff7774}
.api-status.status-loading .status-symbol,.source-status-indicator.status-loading{background:#718096;color:#fff}
.source-status-indicator.status-ok{background:#08d46b;box-shadow:0 0 10px #08d46b55}
.source-status-indicator.status-warning{background:#f0a52b;box-shadow:0 0 9px #f0a52b55}
.source-status-indicator.status-error{background:#ef4444;box-shadow:0 0 9px #ef444455}
.source-status-details{position:absolute;z-index:20;right:18px;top:calc(100% - 2px);width:min(430px,calc(100vw - 24px));padding:15px;background:#fff;color:#0a1b46;border:1px solid #dce6f1;border-radius:12px;box-shadow:0 12px 35px #142b4530}
.source-status-heading{display:flex;justify-content:space-between;gap:12px;align-items:center;font-weight:750;font-size:13px;margin-bottom:13px}
.source-status-heading span{font-size:10px;font-weight:500;color:#71839a;text-align:right}
.source-status-row{display:flex;gap:10px;padding:10px 0;border-top:1px solid #edf1f6}
.source-status-indicator{width:9px;height:9px;flex:0 0 9px;border-radius:50%;margin-top:5px;background:#9aa8b5}
.source-status-row strong{font-size:12px}
.source-status-row p{margin:3px 0;color:#4f6d99;font-size:12px}
.source-status-row small{color:#7a8ba2;font-size:10px;line-height:1.4}
.source-status-footnote{border-top:1px solid #edf1f6;padding-top:10px;margin-top:4px;color:#71839a;font-size:10px;line-height:1.5}
@media(max-width:650px){.source-status-details{right:8px;top:calc(100% - 2px)}.api-status{max-width:100%;min-width:0}}

/* Mobile header: slightly more compact brand group */
@media(max-width:650px){
 .brand{min-width:max-content;flex-shrink:0;gap:6px}
 .brand-logo{width:36px;height:36px;flex:0 0 36px}
 .brand-name{font-size:21px;letter-spacing:-.6px}
 .brand-sub{font-size:8px;letter-spacing:.8px;line-height:1.4}
 .api-status{align-items:center}
 }
@media(max-width:420px){
 .topbar{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;column-gap:6px;row-gap:10px}
 .brand{grid-column:1;grid-row:1;justify-self:start;min-width:0;gap:5px}
 .api-status{grid-column:2;grid-row:1;justify-self:end;align-self:center;margin:0;max-width:100%;font-size:9px;padding:5px 7px;gap:4px}
 .api-status .status-symbol{width:15px;height:15px;flex-basis:15px;font-size:11px}
 .nav{grid-column:1/-1;grid-row:2;margin-top:0}
}
@media(max-width:360px){
 .brand-name{font-size:21px}
 .brand-logo{width:36px;height:36px;flex:0 0 36px}
 .api-status{font-size:10px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* Upcoming matches: presentation structure (data will be bound separately). */
.left-panel{display:flex;flex-direction:column;gap:12px}
.matches-panel-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 2px 10px;border-bottom:1px solid var(--line)}
.matches-panel-title{margin:0;font-size:17px;font-weight:800;letter-spacing:-.25px;color:var(--ink)}
.matches-panel-caption{font-size:11px;color:var(--muted)}
.upcoming-matches-list{display:flex;flex-direction:column;gap:9px;min-width:0}
.upcoming-match-card{display:grid;grid-template-columns:minmax(118px,.8fr) minmax(0,2.2fr) 76px;align-items:center;gap:14px;padding:13px 14px;background:#fff;border:1px solid #e4ebf4;border-radius:11px;box-shadow:0 2px 8px rgba(17,43,72,.025)}
.match-meta{display:flex;flex-direction:column;gap:5px;min-width:0}
.match-kickoff{font-size:13px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.match-competition{font-size:11px;line-height:1.45;color:var(--muted);font-weight:600}
.match-teams{display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);align-items:center;gap:9px;min-width:0}
.match-team{display:flex;align-items:center;gap:9px;min-width:0}
.match-team-away{justify-content:flex-end;text-align:right}
.match-team-logo{width:30px;height:30px;flex:0 0 30px;object-fit:contain}
.match-team-name{font-size:13px;font-weight:750;line-height:1.25;overflow-wrap:anywhere}
.match-versus {
  text-align: center;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .6px;
  background: #087747!important;
  color: #ffffff!important;
}
.match-stats-button{justify-self:end;min-width:68px;padding:8px 10px;border:1px solid #dce6f1;border-radius:8px;background:#f5f8fc;color:#8392a5;font-size:11px;font-weight:750}
.match-stats-button:disabled{cursor:not-allowed;opacity:.8}
@media(max-width:760px){
 .upcoming-match-card{grid-template-columns:minmax(0,1fr) 70px;gap:10px;padding:12px}
 .match-meta{grid-column:1/-1;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:5px 12px}
 .match-kickoff{grid-column:1}
 .match-competition{grid-column:2;text-align:right}
 .match-teams{grid-column:1;grid-row:2}
 .match-stats-button{grid-column:2;grid-row:2}
}
@media(max-width:420px){
 .match-teams{grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr);gap:5px}
 .match-team{gap:6px}
 .match-team-logo{width:24px;height:24px;flex-basis:24px}
 .match-team-name{font-size:11px}
 .match-kickoff{font-size:12px}
 .match-competition{font-size:10px}
}

/* Éléments persistants pendant le défilement */
:root{--sticky-header-height:86px}
.topbar{position:sticky;top:0;z-index:50}
.filters{position:sticky;top:var(--sticky-header-height);z-index:40;background:#fff}
@media(max-width:1120px){:root{--sticky-header-height:138px}}
@media(max-width:650px){:root{--sticky-header-height:140px}}
@media(max-width:420px){:root{--sticky-header-height:125px}}

/* Barre de filtres — reproduction du style de PronoFoot-AI-Site */
.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.filters{height:68px;display:flex;align-items:center;gap:12px;padding:9px 20px;background:#ffffffc9;border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);margin:0 0 14px}
.filter-label{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:750;white-space:nowrap;margin-right:7px}
.filter-btn{min-width:0;min-height:54px;display:flex;align-items:center;gap:10px;padding:6px 16px;background:#fbfdff;border:1px solid var(--line);border-radius:9px;color:var(--ink);font-weight:650;white-space:nowrap;box-shadow:0 2px 5px #1a3b5906;transition:background .18s ease,box-shadow .18s ease,transform .18s ease}
.filter-copy{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:1px;line-height:1.2}
.filter-title{font-size:13px;font-weight:750}
.filter-dates{font-size:11px;font-weight:550;opacity:.76}
.filter-btn.is-active{background:linear-gradient(115deg,#0bc36d,#21868b);border:0;color:#fff;box-shadow:0 3px 8px #00a95d22}
/* Survol discret réservé aux boutons inactifs. */
.filter-btn:not(.is-active):hover{background:#f1f3f5}
.filter-btn:focus-visible{outline:2px solid #159b8e;outline-offset:3px}
.filter-btn .icon{width:21px;height:21px;display:inline-block;flex:0 0 auto;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.filter-btn .icon.large{width:25px;height:25px}
.search{margin-left:auto;width:220px;max-width:24vw;height:42px;padding:0 13px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);outline-color:var(--green)}
.competition-select{flex:0 1 220px;min-width:170px;height:42px;padding:0 34px 0 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:600 13px inherit;outline-color:var(--green)}
.competition-select:focus{border-color:#159b8e;box-shadow:0 0 0 3px #159b8e18}
.search:focus{border-color:#159b8e;box-shadow:0 0 0 3px #159b8e18}
@media(max-width:1100px){
 .filters{height:auto;min-height:0;padding:10px;gap:8px;flex-wrap:wrap}
 .filter-label{width:100%;font-size:15px;margin:0 0 2px}
 .filter-btn{flex:1 1 calc(33.333% - 8px);justify-content:center;padding:7px 9px;gap:7px}
 .filter-copy{align-items:center;text-align:center}
 .filter-title{font-size:12px}
 .filter-dates{font-size:10px}
 .search{margin:0;flex:1 1 100%;width:100%;max-width:none}
 .competition-select{flex:1 1 100%;width:100%;min-width:0}
}
@media(max-width:600px){
 .filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch;gap:7px;padding:9px}
 .filter-label,.search,.competition-select{grid-column:1/-1;width:100%}
 .filter-label{margin:0 0 1px}
 .filter-btn{width:100%;min-width:0;min-height:58px;padding:7px 4px;gap:3px;flex-direction:column;white-space:normal}
 .filter-btn .icon{width:17px;height:17px;flex:0 0 17px}
 .filter-copy{width:100%;min-width:0;align-items:center}
 .filter-title{font-size:10px;line-height:1.15;overflow-wrap:anywhere}
 .filter-dates{font-size:9px;line-height:1.15}
 .search{grid-column:1/-1;margin:0}
}
@media(max-width:360px){
 .filters{gap:5px;padding:7px}
 .filter-btn{min-height:56px;padding:6px 2px}
 .filter-btn .icon{display:none}
 .filter-title{font-size:9px}
 .filter-dates{font-size:8px}
}

/* Mise en page sur la hauteur de l'écran : seule la liste des matchs défile */
body{display:flex;flex-direction:column;height:100vh;min-height:0;overflow:hidden}
@supports (height:100dvh){body{height:100dvh}}
.topbar{position:relative;top:auto;left:auto;right:auto;width:auto;z-index:10;flex:0 0 auto}
main{display:flex;flex:1 1 auto;flex-direction:column;min-height:0;padding:15px 18px 12px}
.filters{position:static;top:auto;left:auto;transform:none;width:auto;max-width:none;height:auto;padding:10px 20px;margin:0 0 12px;z-index:auto;flex:0 0 auto;background:#ffffffc9;box-shadow:var(--shadow);border-color:var(--line)}
.workspace{flex:1 1 auto;min-height:0}
.panel{min-height:0}
.left-panel{min-height:0}
.upcoming-matches-list{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-right:3px}
.footer{flex:0 0 auto;padding:7px 18px 10px}

/* Contenu du header, zone principale et footer alignés sur 1600px */
.topbar{
 padding-left:max(20px,calc((100% - 1600px)/2 + 20px));
 padding-right:max(20px,calc((100% - 1600px)/2 + 20px));
}

.workspace{align-self:stretch;width:100%;max-width:none;margin-left:0;margin-right:0}
.footer{align-self:center;width:min(100%,1600px);max-width:1600px}

@media(max-width:1100px){
 main{padding:10px 10px 8px}

}
@media(max-width:650px){
 main{padding:10px 10px 7px}

button,
.standings-toolbar,
select,
input,
.standings-season,
.panel,
.standings-table-wrap{

/* Rayon des coins du bloc filtres */
.filters{
  border-radius:4px!important;
}


/* Nouveau listing : lignes ouvertes, sans encadré global */
.matches-list-section{width:100%;min-width:0}
.match-day-heading{display:flex;align-items:center;gap:12px;min-height:48px;margin:0 0 12px;padding:3px 0;background:transparent;border:0;border-radius:0;box-shadow:none;overflow:visible}
.match-day-icon{display:flex;align-items:center;justify-content:center;flex:0 0 28px;width:28px;height:28px;background:transparent;color:#17385f}
.match-day-icon svg{display:block;width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.match-day-divider{width:2px;height:32px;flex:0 0 2px;border-radius:2px;background:#08a66a}
.match-day-label{color:#142f53;font-size:19px;font-weight:800;letter-spacing:-.35px;line-height:1.15}
.match-day-count{display:inline-flex;align-items:center;justify-content:center;gap:6px;margin-left:auto;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none;color:#079653;font-size:16px;font-weight:750;line-height:1;white-space:nowrap}
.match-day-count svg{width:23px;height:23px;flex:0 0 23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:650px){.match-day-heading{gap:7px;min-height:40px;margin-bottom:9px;padding:2px 0}.match-day-icon{flex-basis:24px;width:24px;height:24px}.match-day-icon svg{width:23px;height:23px}.match-day-divider{height:27px;width:2px;flex-basis:2px}.match-day-label{font-size:16px;letter-spacing:-.3px}.match-day-count{gap:4px;font-size:13px}.match-day-count svg{width:19px;height:19px;flex-basis:19px}}
.match-period-summary{display:inline-flex;align-items:center;gap:12px;margin:0 0 16px;padding:9px 22px;border-radius:28px;background:#e5efff;color:#09275f}
.match-count-icon{font-size:25px;line-height:1}
.match-period-summary strong{font-size:19px;font-weight:800}
.upcoming-matches-list{display:flex;flex-direction:column;gap:0;width:100%;min-width:0;overflow:visible}
.upcoming-match-card{position:relative;display:grid;grid-template-columns:205px 220px minmax(0,1fr) 54px minmax(0,1fr) 112px;align-items:center;gap:16px;min-width:0;min-height:100px;padding:9px 16px 9px 3px;border:0;border-radius:0;box-shadow:none;background:#fff}
.upcoming-match-card:nth-child(even){background:#f0f6ff}
.upcoming-match-card::before{content:"";position:absolute;left:3px;top:8px;bottom:8px;width:6px;border-radius:4px;background:#285c9c}
.upcoming-match-card:first-child::before{background:#259b70}
.match-meta{display:flex;align-items:center;justify-content:center;min-height:82px;margin-left:0;padding:8px 12px 8px 18px;border-right:2px solid #cbdcf5;background:#f1f6fd;text-align:center}
.match-kickoff{display:flex;flex-direction:column;gap:3px;font-size:17px;font-weight:800;line-height:1.25;color:#071d49;font-variant-numeric:tabular-nums;white-space:normal}
.match-kickoff .match-date{font-size:15px}
.match-kickoff .match-time{font-size:25px}
.match-kickoff-clock{display:inline-flex;align-items:center;margin-left:6px;font-size:17px;line-height:1;color:#52739e;vertical-align:middle}
.competition-country-flag{display:inline-block;width:20px;height:14px;flex:0 0 20px;object-fit:cover;vertical-align:middle;border-radius:2px;box-shadow:0 0 0 1px #10264f22}
.competition-mark .competition-country-flag{margin-left:3px}
.competition-country-flag-mobile{display:none}
@media(max-width:700px){
  .competition-country-flag-mobile{display:inline-block;width:20px;height:14px;object-fit:cover;vertical-align:middle;margin-right:4px;border-radius:2px;box-shadow:0 0 0 1px #10264f22}
}
.match-detail-clock{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:5px;color:#52739e;flex:0 0 18px}
.match-detail-clock svg{display:block;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.match-competition{display:flex;align-items:center;gap:12px;min-width:0;color:#10264f}
.competition-mark{display:flex;align-items:center;justify-content:center;width:28px;height:34px;color:#e87527;font-size:25px}
.competition-copy{display:flex;flex-direction:column;gap:3px;min-width:0}
.competition-copy strong{font-size:14px;font-weight:850;text-transform:uppercase}
.competition-copy small{font-size:14px;color:#52739e;line-height:1.3}
.match-team{display:flex;align-items:center;gap:12px;min-width:0}
.match-team-away{justify-content:flex-start}
.match-team-logo{width:46px;height:46px;flex:0 0 46px;object-fit:contain}
.match-team-name{font-size:18px;font-weight:800;line-height:1.2;color:#071d49;overflow-wrap:anywhere}
.match-versus{justify-self:center;padding:7px 13px;border-radius:10px;background:#e5effb;color:#12366d;font-size:15px;font-weight:850}
.match-stats-button{justify-self:end;display:flex;align-items:center;justify-content:center;gap:8px;min-width:104px;padding:10px 12px;border:1.5px solid #8eafe3;border-radius:11px;background:transparent;color:#12366d;font-size:17px;font-weight:800}
.match-stats-button:disabled{cursor:not-allowed;opacity:1}
@media(max-width:1050px){
 .upcoming-match-card{grid-template-columns:170px 170px minmax(0,1fr) 42px minmax(0,1fr) 88px;gap:10px;padding-right:10px}
 .match-kickoff .match-date{font-size:13px}
 .match-kickoff .match-time{font-size:22px}
 .match-team-logo{width:36px;height:36px;flex-basis:36px}
 .match-team-name{font-size:15px}
 .competition-copy small{font-size:12px}
 .match-stats-button{min-width:82px;font-size:14px;padding:8px}
}
@media(max-width:700px){
 .match-period-summary{margin-bottom:10px;padding:7px 15px}
 .match-period-summary strong{font-size:16px}
 .upcoming-match-card{grid-template-columns: minmax(0,1fr) 42px minmax(0,1fr) 76px;gap:7px 9px;min-height:0;padding:10px 8px 10px 12px}
 .upcoming-match-card::before{left:2px;top:7px;bottom:7px;width:4px}
 .match-meta{grid-column:1/3;grid-row:1;justify-content:flex-start;min-height:0;margin-left:0;padding:2px 0 4px 5px;border:0;background:transparent;text-align:left}
 .match-kickoff{flex-direction:row;align-items:baseline;gap:8px;font-size:12px}
 .match-kickoff .match-date{font-size:12px}
 .match-kickoff .match-time{font-size:15px}
 .match-competition{grid-column:3/5;grid-row:1;justify-content:flex-end;gap:5px}
 .competition-mark{width:18px;font-size:17px}
 .competition-copy strong{font-size:10px}
 .competition-copy small{font-size:10px}
 .match-team-home{grid-column:1;grid-row:2}
 .match-versus{grid-column:2;grid-row:2;padding:5px 7px;font-size:11px}
 .match-team-away{grid-column:3;grid-row:2}
 .match-team-logo{width:27px;height:27px;flex-basis:27px}
 .match-team{gap:5px}
 .match-team-name{font-size:12px}
 .match-stats-button{grid-column:4;grid-row:2;min-width:0;padding:6px 7px;font-size:12px}
}


/* Répartition de l'espace : listing 60 %, sidebar 40 % */
.workspace{
  display:grid!important;
  grid-template-columns:minmax(0,3fr) minmax(0,2fr)!important;
  gap:12px!important;
  align-items:stretch;
  width:100%;
}
.matches-list-section{
  min-width:0;
  padding:0!important;
  background:transparent!important;
  border:0!important;
  border-radius:0!important;
  box-shadow:none!important;
}
.right-panel{
  display:block;
  min-width:0;
}
@media(max-width:1120px){
  .workspace{grid-template-columns:minmax(0,1fr)!important}
}

/* Sélection du match : retour visuel discret et accessible */
.upcoming-match-card{cursor:pointer;transition:background-color .16s ease,box-shadow .16s ease}

  background:#e5efff!important;
  box-shadow:inset 0 0 0 1px #9bbbe8,inset 4px 0 0 #3976bd!important;
}

.match-stats-button{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-width:76px;padding:7px 9px;border:1px solid #b7cbe7;border-radius:7px;
  background:#f7faff;color:#244f83;font-size:12px;font-weight:750;
  white-space:nowrap;pointer-events:none;
}

/* Compétition et phase à droite des deux équipes */

<script>
(() => {
  const button = document.getElementById("pageScrollTop");
  if (!button) return;
  const updateVisibility = () => button.classList.toggle("is-visible", window.scrollY > 120);
  window.addEventListener("scroll", updateVisibility, { passive: true });
  button.addEventListener("click", () => {
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
  });
  updateVisibility();
})();
</script>

/* Style commun des en-têtes historiques */
.history-card-heading {
    padding: 10px 12px !important;

/* Accordéons : + pour ouvrir, − pour fermer */
.match-detail-accordion-chevron{

  justify-content:center!important;
  font-size:0!important;
  line-height:1!important;
  transform:none!important;
}

  content:"+"!important;
  display:block;
  font-size:23px;
  line-height:1;
  font-weight:500;
}

}

/* Forme récente : pastilles V / N / D plus visibles */
.history-form-chip{
  width:30px!important;
  height:30px!important;
  min-width:30px!important;
  border:1px solid rgba(16,47,82,.16)!important;
  border-radius:6px!important;

  font-weight:950!important;
  box-shadow:0 1px 2px rgba(16,47,82,.14)!important;

.history-form-chip.is-win{

  color:#fff!important;
}
.history-form-chip.is-draw{
  background:#b7791f!important;
  color:#fff!important;
}
.history-form-chip.is-loss{

}

/* Info-bulle Forme récente : portail hors des conteneurs overflow:hidden */
.history-form-chip::after{content:none!important;display:none!important}
.history-tooltip-portal{
  position:fixed;z-index:999999;display:block;box-sizing:border-box;
  width:max-content;max-width:min(280px,calc(100vw - 24px));
  padding:9px 11px;border:1px solid #dbe5f1;border-radius:8px;
  background:#102746;color:#fff;font-size:12px;font-weight:650;line-height:1.45;

}
.history-tooltip-portal[hidden]{display:none!important}

/* H2H : barres horizontales de répartition des résultats */
.history-h2h-bars{display:flex;flex-direction:column;gap:15px;width:100%;padding:8px 4px 14px}
.history-h2h-bar-row{display:flex;flex-direction:column;gap:7px;min-width:0}

.history-h2h-bar-label b{flex:1;min-width:0;font-size:13px;font-weight:800;overflow-wrap:anywhere}

.history-h2h-dot.home,.history-h2h-track span.home{background:#159947}

.history-h2h-track{height:12px;overflow:hidden;border-radius:99px;background:#edf1f5}
.history-h2h-track span{display:block;height:100%;min-width:0;border-radius:99px;transition:width .2s ease}


/* H2H et forme récente : couleurs et badges affinés */
.history-h2h-dot.draw,.history-h2h-track span.draw{background:#b7791f!important}
/* Autre championnat : icône globe discrète, sans décalage des pastilles */
.history-form-item{flex-direction:row!important;align-items:center!important;gap:0!important;min-width:30px!important}
.history-form-chip.is-other-competition{border-color:transparent!important;box-shadow:none!important}
.history-form-other-icon{position:absolute;right:-4px;bottom:-4px;z-index:2;display:flex;width:13px;height:13px;align-items:center;justify-content:center;border:1px solid #fff;border-radius:50%;background:#fff;color:#174a7e}
.history-form-other-icon svg{display:block;width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
