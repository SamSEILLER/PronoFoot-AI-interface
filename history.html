<p class="level-intro">Pour chaque marché, le pourcentage indique la part des matchs de chaque équipe où le critère a été atteint : au moins 2 buts (+1,5), au moins 3 buts (+2,5) ou les deux équipes qui marquent (BTTS).</p>

</div></section>
<section><h3 class="engine-subtitle"><span class="engine-subtitle-icon">▱</span>À retenir</h3><div class="engine-keep">

<div class="keep-line"><span class="keep-check">✓</span><span>Pas de pronostic OUI/NON ni de probabilité Poisson.</span></div>

function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function renderVersion(v,i){
const id=String(v.id||('version-'+i)),active=v.status==='active',label=v.label||id;
const title=id==='v1'?'Analyse historique':label.replace(/^Moteur\s*V\d+\s*[—-]?\s*/i,'');
const panelId='engine-panel-'+id.replace(/[^a-zA-Z0-9_-]/g,'-');
const content=id==='v1'?v1Details:'<div class="engine-fallback">'+esc(v.description||'Aucune description détaillée disponible pour cette version.')+'</div>';
const article=document.createElement('article');article.className='engine-accordion';
article.innerHTML='<button class="engine-toggle '+(active?'':'archived')+'" type="button" aria-expanded="false" aria-controls="'+panelId+'"><span class="engine-version">'+esc(id.toUpperCase())+'</span><span class="engine-toggle-title">'+esc(title)+'</span><span class="engine-toggle-status"><span class="tag '+(active?'active':'')+'">'+(active?'✓ Moteur actif':'Version archivée')+'</span></span><span class="engine-chevron" aria-hidden="true">+</span></button><div class="engine-panel" id="'+panelId+'" hidden>'+content+'</div>'+"<section class=\"engine-performance\" aria-label=\"Bilan des réussites historiques\"><h3 class=\"engine-performance-title\">Réussite sur les matchs passés</h3><div class=\"engine-performance-grid\"><div class=\"engine-performance-cell\"><span>Matchs évalués</span><strong data-stat=\"matches\">—</strong><small>Résultat final et classement disponibles</small></div><div class=\"engine-performance-cell\"><span>Réussite +1,5 buts</span><strong data-stat=\"over_1_5\">—</strong><small data-detail=\"over_1_5\">Chargement…</small></div><div class=\"engine-performance-cell\"><span>Réussite +2,5 buts</span><strong data-stat=\"over_2_5\">—</strong><small data-detail=\"over_2_5\">Chargement…</small></div><div class=\"engine-performance-cell\"><span>Réussite BTTS</span><strong data-stat=\"btts\">—</strong><small data-detail=\"btts\">Chargement…</small></div></div><p class=\"engine-performance-help\">Niveau 1 ou 2 = OUI ; niveau 3 ou 4 = NON. Une réussite est comptée lorsque cette réponse correspond au score final. Les matchs sans score final ou sans niveau exploitable sont exclus.</p></section><section class=\"engine-match-list\" aria-label=\"Liste des matchs\"><h3>Liste des matchs</h3><div class=\"engine-match-content\"><div class=\"engine-match-empty\">Chargement des matchs…</div></div></section>";
const btn=article.querySelector('.engine-toggle'),panel=article.querySelector('.engine-panel');
btn.addEventListener('click',()=>{const open=btn.getAttribute('aria-expanded')==='true';btn.setAttribute('aria-expanded',String(!open));panel.hidden=open;btn.querySelector('.engine-chevron').textContent=open?'+':'−';});
return article;
}
try{
const response=await fetch('./data/prediction-history-index.json',{cache:'no-store'});
if(!response.ok)throw new Error('Le catalogue des moteurs est indisponible (HTTP '+response.status+').');
const catalog=await response.json(),versions=Array.isArray(catalog.versions)?catalog.versions:[];
if(!versions.length)throw new Error('Aucun moteur de pronostic n’est référencé dans le catalogue.');
list.replaceChildren(...versions.map(renderVersion));
await Promise.all(versions.map(async v=>{
 if(!v.archive)return;
 const article=[...list.querySelectorAll('.engine-accordion')].find(a=>a.querySelector('.engine-version')?.textContent===String(v.id||'').toUpperCase());
 if(!article)return;
 const target=article.querySelector('.engine-performance');if(!target)return;
 try{
  const archiveResponse=await fetch('./data/'+encodeURIComponent(v.archive),{cache:'no-store'});
  if(!archiveResponse.ok)throw new Error('Archive indisponible');
  const archive=await archiveResponse.json(),records=Array.isArray(archive.records)?archive.records:[];
  const matchContent=article.querySelector('.engine-match-content');
  const pageSize=10;let currentPage=1;const tierNames={1:'Très favorable',2:'Favorable',3:'Mitigé',4:'Défavorable'};
  const fmtDate=value=>{const d=new Date(value);return Number.isNaN(d.getTime())?'—':d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});};
  const tierCell=value=>{const tier=value?.tier;if(![1,2,3,4].includes(tier))return '<span class="engine-match-tier">—</span>';return '<span class="engine-match-tier t'+tier+'">N'+tier+' · '+tierNames[tier]+'</span>';};
  const ordered=[...records].sort((a,b)=>String(b.kickoff_utc||'').localeCompare(String(a.kickoff_utc||'')));
  function drawMatches(){const pages=Math.max(1,Math.ceil(ordered.length/pageSize));currentPage=Math.min(currentPage,pages);const shown=ordered.slice((currentPage-1)*pageSize,currentPage*pageSize);if(!ordered.length){matchContent.innerHTML='<div class="engine-match-empty">Aucun match dans cette archive.</div>';return;}matchContent.innerHTML='<div class="table-wrap"><table class="engine-match-table"><thead><tr><th>Match</th><th>Date</th><th>+1,5 buts</th><th>+2,5 buts</th><th>BTTS</th><th>Score final</th></tr></thead><tbody>'+shown.map(r=>{const h=r.actual?.home_score,a=r.actual?.away_score,score=Number.isFinite(h)&&Number.isFinite(a)?h+' – '+a:'À jouer / en attente';return '<tr><td><span class="engine-match-teams">'+esc(r.home_team)+' – '+esc(r.away_team)+'</span><span class="engine-match-meta">'+esc(r.competition||'Compétition non renseignée')+' · '+esc(r.season||'')+'</span></td><td>'+fmtDate(r.kickoff_utc)+'</td><td>'+tierCell(r.prediction?.over_1_5)+'</td><td>'+tierCell(r.prediction?.over_2_5)+'</td><td>'+tierCell(r.prediction?.btts)+'</td><td><strong>'+score+'</strong></td></tr>';}).join('')+'</tbody></table></div><div class="engine-match-pagination"><span>Matchs '+((currentPage-1)*pageSize+1)+' à '+Math.min(currentPage*pageSize,ordered.length)+' sur '+ordered.length+'</span><div><button type="button" data-page="prev" '+(currentPage===1?'disabled':'')+'>Précédent</button> <button type="button" data-page="next" '+(currentPage===pages?'disabled':'')+'>Suivant</button></div></div>';matchContent.querySelector('[data-page="prev"]')?.addEventListener('click',()=>{currentPage--;drawMatches();});matchContent.querySelector('[data-page="next"]')?.addEventListener('click',()=>{currentPage++;drawMatches();});}
  drawMatches();
  const keys=['over_1_5','over_2_5','btts'],stats={};
  for(const key of keys)stats[key]={evaluated:0,success:0};
  let common=0;
  for(const record of records){
   const hs=record.actual?.home_score,as=record.actual?.away_score;
   if(!Number.isFinite(hs)||!Number.isFinite(as))continue;
   let allMarkets=true;
   for(const key of keys){
    const tier=record.prediction?.[key]?.tier;
    if(![1,2,3,4].includes(tier)){allMarkets=false;continue;}
    const predictedYes=tier===1||tier===2;
    const actualYes=key==='over_1_5'?hs+as>=2:key==='over_2_5'?hs+as>=3:hs>=1&&as>=1;
    stats[key].evaluated++;
    if(predictedYes===actualYes)stats[key].success++;
   }
   if(allMarkets)common++;
  }
  target.querySelector('[data-stat="matches"]').textContent=String(common);
  for(const key of keys){
   const item=stats[key],pct=item.evaluated?item.success/item.evaluated*100:null;
   target.querySelector('[data-stat="'+key+'"]').textContent=pct===null?'—':pct.toLocaleString('fr-FR',{maximumFractionDigits:1})+' %';
   target.querySelector('[data-detail="'+key+'"]').textContent=item.evaluated?item.success+' réussites / '+item.evaluated+' matchs':'Aucun match évaluable';
  }
 }catch(err){target.querySelectorAll('strong').forEach(el=>el.textContent='—');target.querySelectorAll('small').forEach(el=>el.textContent='Statistiques indisponibles');}
}));
}catch(e){list.innerHTML='<div class="engine-fallback">Impossible de charger la liste des moteurs.</div>';error.hidden=false;error.textContent=e.message||'Une erreur est survenue.';error.classList.add('error');}
})();
</script>
